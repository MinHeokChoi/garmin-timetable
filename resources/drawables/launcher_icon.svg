<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 일정 목록에서 "지금" 하나가 강조된 형태.
       강조색은 앱 본체의 ACCENT_NOW(0x00FF00)와 같다.
       40~70px 로 축소되므로 획을 두껍게 두고 캔버스를 꽉 채운다. -->
  <rect width="24" height="24" fill="#000000"/>
  <rect x="3" y="3"    width="15" height="4.5" rx="2.25" fill="#F4F4F4"/>
  <rect x="3" y="9.75" width="18" height="5"   rx="2.5"  fill="#00FF00"/>
  <rect x="3" y="16.5" width="11" height="4.5" rx="2.25" fill="#F4F4F4"/>
</svg>
