<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Class</title>
<link rel="stylesheet" href="style.css">

<div class="top">
  <h1 data-t="title">시간표를 시계에 넣기</h1>
  <div class="langs">
    <button class="lang" data-lang="ko">한국어</button>
    <button class="lang" data-lang="en">English</button>
    <button class="lang" data-lang="zh">简体中文</button>
    <button class="lang" data-lang="ja">日本語</button>
    <button class="lang" data-lang="fr">Français</button>
    <button class="lang" data-lang="de">Deutsch</button>
    <button class="lang" data-lang="es">Español</button>
    <button class="lang" data-lang="it">Italiano</button>
    <button class="lang" data-lang="pl">Polski</button>
  </div>
</div>

<div class="lead">
  <button id="copyPrompt" class="btn primary" data-t="copyPrompt">프롬프트 복사</button>
  <p><span data-t="lead1">챗봇에 <b>시간표 사진과 함께</b> 붙여넣으면 한 줄이 나옵니다.
    그대로 Garmin Connect 에 넣어도 되고, 고칠 게 있으면 아래에 붙여넣으세요.</span>
    <a href="#" id="showPrompt" class="lnk" data-t="showPrompt">프롬프트 보기</a></p>
</div>

<pre id="prompt" class="prompt" hidden>…</pre>

<textarea id="paste" rows="5"></textarea>

<div id="result" hidden>
  <div class="card">
    <div class="cardhead">
      <b data-t="where">Garmin Connect → Next Class → 설정 → 한 번에 입력</b>
      <span id="len" class="len"></span>
    </div>
    <code id="week" class="val"></code>
    <button id="copyWeek" class="btn primary wide" data-t="copy">복사</button>
  </div>
  <div id="notice" class="notice"></div>
</div>

<details class="fold" id="editor">
  <summary><span data-t="edit">확인하고 고치기</span> <span id="editBadge" class="badge"></span></summary>

  <div id="tabs" class="tabs"></div>
  <div class="edit">
    <div class="table">
      <div id="rows"></div>
      <button id="add" class="btn ghost wide" data-t="add">+ 수업 추가</button>
    </div>
    <div class="side">
      <div class="watch"><div id="preview" class="screen"></div></div>
      <p class="cap" data-t="cap">시계에서 보이는 모습 (근사)</p>
    </div>
  </div>

  <details class="fold sub">
    <summary data-t="byday">요일별로 나눠 넣기</summary>
    <p class="hint" data-t="bydayHint">전체 칸이 길어서 안 들어갈 때만.</p>
    <div id="out" class="out"></div>
  </details>

  <button id="clear" class="btn ghost" data-t="clear">전부 지우기</button>
</details>

<footer>
  <p data-t="foot1"><b>과목명이 한글이면 시계 언어도 한국어여야 합니다.</b> 시계 → 설정 → 시스템 → 언어</p>
  <p class="dim" data-t="foot2">입력한 내용은 어디에도 전송되지 않습니다.</p>
</footer>

<script src="i18n.js"></script>
<script src="app.js"></script>
