<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101216">
  <title>Next Class</title>
  <link rel="stylesheet" href="style.css?v=1.2.2">
</head>
<body>
  <header>
    <h1 data-t="title">Put your timetable on your watch</h1>
    <select id="langSelect" aria-label="Language">
      <option value="ko">한국어</option>
      <option value="en" selected>English</option>
      <option value="zh">简体中文</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pl">Polski</option>
    </select>
  </header>

  <main>
    <section class="step">
      <span class="number" aria-hidden="true">1</span>
      <p data-t="step1">You need the free version of ChatGPT or Claude.</p>
    </section>
    <section class="step">
      <span class="number" aria-hidden="true">2</span>
      <div>
        <p data-t="step2">Copy the prompt and send it with a photo of your timetable in an AI chat.</p>
        <button id="copyPrompt" type="button" disabled data-t="copyPrompt">Copy prompt</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <textarea id="promptFallback" class="fallback" readonly hidden></textarea>
      </div>
    </section>
    <section class="step">
      <span class="number" aria-hidden="true">3</span>
      <p data-t="step3">Paste the reply into the timetable field in Connect IQ → Next Class → Settings, then save.</p>
    </section>
  </main>

  <script src="i18n.js?v=1.2.2"></script>
  <script src="app.js?v=1.2.2"></script>
</body>
</html>
