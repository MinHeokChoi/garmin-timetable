<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101216">
  <title>Next Class</title>
  <link rel="stylesheet" href="style.css?v=1.2.1">
</head>
<body>
  <header>
    <h1 data-t="title">시간표를 시계에 넣기</h1>
    <select id="langSelect" aria-label="Language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="zh">简体中文</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="pl">Polski</option>
    </select>
  </header>

  <main>
    <section class="step">
      <span class="number" aria-hidden="true">1</span>
      <p data-t="step1">ChatGPT 또는 Claude 무료 버전이 필요합니다.</p>
    </section>
    <section class="step">
      <span class="number" aria-hidden="true">2</span>
      <div>
        <p data-t="step2">프롬프트를 복사해 AI 채팅방에 시간표 사진과 함께 보내세요.</p>
        <button id="copyPrompt" type="button" disabled data-t="copyPrompt">프롬프트 복사</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <textarea id="promptFallback" class="fallback" readonly hidden></textarea>
      </div>
    </section>
    <section class="step">
      <span class="number" aria-hidden="true">3</span>
      <p data-t="step3">받은 답변을 Connect IQ 앱 → Next Class → 설정의 시간표 입력칸에 붙여넣고 저장하세요.</p>
    </section>
  </main>

  <script src="i18n.js?v=1.2.1"></script>
  <script src="app.js?v=1.2.1"></script>
</body>
</html>
